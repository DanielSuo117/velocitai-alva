[pytest]
# 代码部分统一在 framework/ 下；harness 按 Claude Code 原生布局放在 .claude/（skills / rules / hooks），
# 项目事实在 docs/，入口是根目录的 CLAUDE.md。
# 这份 ini 留在根目录，使得在仓库根直接 pytest 也能正确找到代码与包路径。
testpaths = framework/tests
pythonpath = framework

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 注册自定义标记，避免 PytestUnknownMarkWarning 淹没真正的告警
markers =
    smoke: 冒烟用例，改动后最先跑的一小撮
    regression: 全量回归用例
    slow: 耗时较长，按需跳过

# 不设 --env 默认值：环境必须由使用者显式指定（见 .claude/rules/agent-behavior）
#
# --alluredir：CLAUDE.md 与 docs/setup.md 里的 `allure serve reports/allure-results`
# 读的就是这里；不配它，用例上的 @allure.feature / story 全都无处落地。
# 这里只落原始 JSON 结果，HTML 仍由人按需 allure serve 现生成，不违背
# .claude/rules/report-strategy「仅失败时生成 HTML 报告」。--clean-alluredir 让目录只保留
# 最近一次运行，避免历次结果堆在一起、报告里混进早已修好的旧失败。
# 路径相对启动目录，因此一律在项目根执行 pytest（reports/ 已被 .gitignore 忽略）。
addopts = -ra --strict-markers --alluredir=reports/allure-results --clean-alluredir
