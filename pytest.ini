[pytest]
# 测试用例放在根目录 tests/（方便查看），fixture 层是 tests/conftest.py；
# 框架代码（core / pages / config / tools）在 framework/；harness 按 Claude Code 原生布局放在 .claude/，
# 项目事实在 docs/，入口是根目录的 CLAUDE.md。
# pythonpath 两项缺一不可：framework 让 `from pages.xxx` / `from core.xxx` / `from config.settings` 可导入，
# 项目根让用例之间的 `from tests.base_test import AlvaBaseTest` 可导入。
# testpaths 只写业务用例的通配，不写整个 tests/：tests/unit 与 tests/e2e 是**框架自身**的
# 自测（自愈引擎、组件作用域），不属于 alva.ai 的 UI 回归。混在一起收集时，一次
# 「全量回归」会跑出 123 条，其中 121 条与站点无关 —— 回归结果里真正该看的那几条被淹没。
# 通配让不带参数的 `pytest --env=prod` 只收 tests/test_*.py；显式传目录仍照跑，
# 因此 `pytest tests/e2e --env=prod --self-heal=on` 不受影响（tests/conftest.py 是它们的
# 祖先 conftest，--env 选项照常注册）。
testpaths = tests/test_*.py
pythonpath = framework .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 注册自定义标记，避免 PytestUnknownMarkWarning 淹没真正的告警
markers =
    smoke: 冒烟用例，改动后最先跑的一小撮
    regression: 全量回归用例
    slow: 耗时较长，按需跳过
    framework: 框架自身的自测（tests/e2e），不属于业务回归；默认不收集，需显式传目录

# 不设 --env 默认值：环境必须由使用者显式指定（见 .claude/rules/agent-behavior）
#
# --alluredir：CLAUDE.md 与 docs/setup.md 里的 `allure serve reports/allure-results`
# 读的就是这里；不配它，用例上的 @allure.feature / story 全都无处落地。
# 这里只落原始 JSON 结果，HTML 仍由人按需 allure serve 现生成，不违背
# .claude/rules/report-strategy「仅失败时生成 HTML 报告」。--clean-alluredir 让目录只保留
# 最近一次运行，避免历次结果堆在一起、报告里混进早已修好的旧失败。
# 路径相对启动目录，因此一律在项目根执行 pytest（reports/ 已被 .gitignore 忽略）。
addopts = -ra --strict-markers --alluredir=reports/allure-results --clean-alluredir
